apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: todo-pv-sc
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: Immediate
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: todo-pv
spec:
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  storageClassName: todo-pv-sc
  local:
    path: /tmp/kube-todo
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - k3d-k3s-default-agent-0
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: todo-pvc
spec:
  storageClassName: todo-pv-sc
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi